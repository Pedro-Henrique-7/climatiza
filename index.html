<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <script src="app.js" defer></script>
    <title>Climatiza</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./assets/climatiza-logo.png" alt="">
            <h1>CLIMATIZA</h1>
        </div>

        <div class="barra-pesquisa">
            <input type="text" placeholder="Localidade">
            <img src="./assets/lupa.png" alt="">
        </div>
        
    </header>

    <main>


        <div class="temperatura" id="card">
            <button id="local">Usar Minha Atual Localização
            </button>
        </div>

        <div class="infos" id="card-infos">
            <div class="qualidade-ar" id="card-qualidade">
                <img src="./assets/qualidadedoaricon.png" alt="">
            </div>

            <div class="min-max" id="card-min-max">

            </div>    
        </div>
    </main>
</body>
</html>
